<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06</title>
</head>
<body>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name" name="Username"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email" name="email" autocomplete="off"><br><br>
        <label for="number">Phone Number:</label>
        <input type="tel" id="number" placeholder="Phone Number" name="phonenumber"><br><br>
        <label for="dob">Date of birth:</label>
        <input type="date" id="dob" placeholder="Date of birth" name="Dateofbirth"><br><br>
        <label>Gender:</label>
        <label for="male">Male</label>
        <input type="radio" id="male" value="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" value="female" name="gender"><br><br>
        <label for="adress">Adress:</label><br><br>
        <textarea id="adress" name="adress" rows="5" cols="9" placeholder="Adress"></textarea><br><br>
        <input type="submit">

    </form>
    </body>
    </html>
