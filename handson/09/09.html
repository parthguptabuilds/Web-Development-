<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form>
        <label for="name">Name</label>
        <input id="name" type="name" placeholder="Name" name="Username"><br><br>

        <input id="Dob" type="date" name="Date Of Birth"><br><br>
    </form>

</body>

</html>
