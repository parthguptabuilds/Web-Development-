<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form_Tag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
    </header>
    <form>
        <label for="name">Name: </label>
        <input type="text" id="name" pattern="[A-Za-z]+" placeholder="Name" name="Username" required><br><br>
        <labl for="email">Email</labl>
        <input type="email" id="email" placeholder="Email" autocomplete="off" required><br><br>
        <label for="age">Age: </label>
        <input type="number" id="age" placeholder="Age" name="age" required><br><br>
        <label for="website">Website Url: </label>
        <input type="url" id="website" placeholder="Website" name="url" required><br><br>
        <label for="password">Password: </label>
        <input type="password" minlength="8" id="password" placeholder="Password" name="Password" required><br><br>
        
        <input id="submit" type="submit">

    </form>
    </body>
    </html>
