<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="12.css">
</head>
<body>
<div class="box">
    <div class="subbox">
    <label>Payment method</label>
    <input type="radio" name="payment" value="upi" id="upi">
    <label for="upi">Upi</label>
    <input type="radio" name="payment" value="bank" id="bank">
    <label for="bank">Bank</label>
    <br><br>
    <label>Hobbies:</label>
    <input id="dance" type="checkbox" name="Dance" value="dance">
    <label for="dance">Dance</label>
    <input id="singing" type="checkbox" name="Singing" value="singing">
    <label for="singing">singing</label>
    <input id="sports" type="checkbox" name="sports" value="sports">
    <label for="sports">Sports</label><br><br>
    <label for="photo">Profile Photo</label>
    <input type="file" id="photo" name="photo"><br><br>
    <label>Salary</label>
    <input type="range" min="100000" max="10000000"><br><br>
    <label>Favorite color</label>
    <input type="color" name="color"><br><br>
    <label>Website Url</label>
    <input type="url" name="url" >
    </div>


</div>
    </body>
    </html>
