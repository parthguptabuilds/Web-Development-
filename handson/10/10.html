<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form>
        <label for="name">Name:-</label>
        <input type="text" id="name" name="Username" placeholder="Name"><br><br>
        <label for="email">Email:-</label>
        <input type="email" id="email" name="Email" autocomplete="off" placeholder="Email"><br><br>
        <label for="mobile">Phone Number</label>
        <input id="mobile" type="tel" name="mobile number" placeholder="Mobile Number"><br><br>
        <label for="age">Age:-</label>
        <input id="age" type="number" name="Age" placeholder="Age"> <br><br>
        <label>Gender</label>
        <input type="radio" value="male" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" value="female" id="female" name="gender">
        <label for="female">Female</label> <br><br>
        <label for="address">Address:-</label>
        <textarea id="address" placeholder="Address" rows="4" cols="5"></textarea><br><br>
        <input type="submit">


    </form>
    </body>
</html>
