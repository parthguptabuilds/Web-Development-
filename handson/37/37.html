<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>

    <h1 id="title">Welcome</h1>
    <p class="para">ababjbabck <span>absbabdjajbdjb</span>aahejfefeanfja</p>

    <script>
        let heading = document.querySelector("#title");
        console.log(heading);
        heading.textContent = "hello";

        let paraa = document.querySelector(".para");
        console.log(paraa);
        paraa.style.color = "red";

        let _span = document.querySelector("span");
        console.log(_span);
        _span.style.fontSize = "25px";
        _span.style.backgroundColor = "yellow"; 
    </script>

</body>

</html>
