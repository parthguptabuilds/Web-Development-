<!--
Internal CSS** is a method of styling where CSS rules are defined within a `<style>` tag 
placed inside the `<head>` section of a single HTML document to apply styles across that entire page. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shpoify</title>

    <style>
        h1,h2{
            color: rgb(255, 0, 47);
        }
    </style>
</head>
<body>

<h1>Shopify</h1>
<h2>Create Your Online Business</h2>
<h3>Choose a Theme</h3>
<h4>Add Products</h4>
<h5>Set Up Payments</h5>
<h6>Launch Your Store</h6>

</body>
</html>
