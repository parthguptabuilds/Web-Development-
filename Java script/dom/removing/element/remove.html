<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <p id="text">This will be removed</p>
    <button onclick="removeElement()">Remove</button>

    <script>
        function removeElement() {
            document.getElementById("text").remove();
        }
    </script>

</body>

</html>
