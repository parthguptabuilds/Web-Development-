<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <p id="text">Hello</p>
    <button onclick="addClass()">Add Class</button>
    <script>
        function addClass() {
            document.getElementById("text").classList.add("highlight");
        }
    </script>
</body>

</html>
