<!--
<table>This tag is use for tables</table>
<tr>This tag use for rows</tr>
<th>This tag is use for heading</th>
<td>This tag is used for column </td>
**The `colspan` attribute is used in the `<th>` tag to span a heading across multiple columns.**
**The `rowspan` attribute is used in the `<th>` tag to span a heading across multiple rows.**
**The `border` attribute is used to add a border around a table and its cells.**

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTag</title>
</head>

<body>
    <table border="1" bgcolor="yellow">
        <tr>
            <th>S.No</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Parth</td>
            <td>17</td>
            <td>Btech</td>
        </tr>
        <tr>
            <td>2</td>
            <td>rohan</td>
            <td>18</td>
            <td>B.A</td>
        </tr>


    </table>


</body>

</html>
