<!-- 
<h1> → Largest heading (Most important)
<h2> → Second largest heading
<h3> → Third largest heading
<h4> → Fourth largest heading
<h5> → Fifth largest heading
<h6> → Smallest heading (Least important)

Example:

<h1>Heading 1</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>
<h6>Heading 6</h6> -->
