<!--
The **<form>** tag is used to create a form in HTML.
"name" attribute Used to identify a form field when submitting data.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form_Tag</title>
</head>

<body>
    <form>
        Name:

        <input type="text" name="UserName" placeholder="Name" ><br><br>

        Email:
        <input type="email" autocomplete="off" placeholder="Email" ><br><br>

        Date:
        <input type="date" ><br><br>
          Age:

        <input type="number" name="Age" placeholder="Age"><br><br>

        Gender:
        <input type="radio" value="male" name="gender">Male
        <input type="radio" value="female" name="gender">Female<br><br>


        Technology:

        <input type="checkbox" value="html" name="Technology">html
        <input type="checkbox" value="css" name="Technology">Css
        <input type="checkbox" value="Java Script" name="Technology">Java script<br><br>

        Select your country:-

        <select name="country" placeholder="Country">
            <option>India</option>
            <option>U.S</option>
        </select><br><br>

        <input type="button" value="click me">
        <input type="submit">
        <input type="reset"><br><br>

        Adress :<br><br>
        <textarea name="Address" rows="4" cols="9" placeholder="Enter Your Address here"></textarea>
    </form>

</body>

</html>
