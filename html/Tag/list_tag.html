<!-- 
<ol>This tag is for ordered lists</ol>
<ul>This tag is for unordered lists</ul>
<dl><dt>This tag is for description lists</dt></dl>
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- Ordered List -->
    <ol> 
        <li>Parth</li>
        <li> Hello</li>
    </ol>
    
    <ol type ="A" start="1"> 
        <li>Parth</li>
        <li> Hello</li>
    </ol>

    <!-- unordered List -->
    <ul>
        <li>Parth</li>
        <li> hi</li>
    </ul>

    <ul type="Square">
        <li>parth</li>
    </ul>

    <!-- description List -->

    <dl>
        <dt>HTML</dt> <!-- this is for list heading  -->
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>

</body>
</html>
