<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <form>
        Name:
        <input type="text" name="Username"><br><br>

        Roll number:
        <input type="number" name="Roll Number"><br><br>

        Select Your Branch:
        <select>
            <option>CSE</option>
            <option>ECE</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>IT</option>
        </select><br><br>

        Gender:
        <input type="radio" value="male" name="gender">Male
        <input type="radio" value="female" name="gender">Female<br><br>

        Year of study:
        <input type="radio" value="1st" name="Year_of_study">1st
        <input type="radio" value="2nd" name="Year_of_study">2nd
        <input type="radio" value="3rd" name="Year_of_study">3rd
        <input type="radio" value="4th" name="Year_of_study">4th<br><br>

        Events Interested in:
        <input type="checkbox" value="Coding Contest" name="Events">Coding Contest
        <input type="checkbox" value="Dance" name="Events">Dance
        <input type="checkbox" value="Music" name="Events">Music
        <input type="checkbox" value="Sports" name="Events">Sports
        <input type="checkbox" value="Quiz" name="Events">Quiz<br><br>

        Any Food Alergy:
        <input type="text" name="food_Alergy" placeholder="optional"><br><br>

        <input type="submit">
        <input type="reset">
    </form>
</body>

</html>
