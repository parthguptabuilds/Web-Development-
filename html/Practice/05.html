<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice5</title>
</head>
<body>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name" name="Username"><br><br>

        Technology:
        <input type="checkbox" name="technology" id="html" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="technology" id="css" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" name="technology" id="js" value="js">
        <label for="js">JS</label><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="email"><br><br>

        Gender:
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        Select course:
        <select name="course">
            <option>Btech</option>
            <option>Mtech</option>
            
        </select><br><br>

        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="10" placeholder="Feedback"></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">reset</button>
        <button type="upload">Upload</button>
    </form>

</body>
</html>
